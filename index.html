<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        /* 讓整個網頁變成完全的黑色，並隱藏滾動條 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 讓影片填滿螢幕，保持比例，不留白邊 */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 如果你想讓影片完全拉伸鋪滿可以改成 cover */
            background-color: #000000;
        }
    </style>
</head>
<body>

    <!-- 
      playsinline: 防止 iPhone 自動跳出全螢幕播放
      autoplay: 自動播放
      loop: 無限循環重複播放
      muted: 靜音（現代瀏覽器規定：影片必須靜音才能網頁一打開就自動播放）
    -->
    <video playsinline autoplay loop muted>
        <source src="video_mp4.mp4" type="video/mp4">
        您的瀏覽器不支援此影片播放。
    </video>

</body>
</html>
